name: ci
on: [push]
# No marketplace actions. The branch push and the main push of one commit start two runs at once; both
# cloned the same action into the runner's shared cache and one failed (wfTrial run 1052, 2026-09-28).
# The runner image (Ubuntu 24.04) already has git and python3.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          git clone -q "$(echo '${{ github.server_url }}' | sed 's#://#://oauth2:${{ github.token }}@#')/${{ github.repository }}.git" .
          git checkout -q "${{ github.sha }}"
      - name: tools
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pytest bandit && echo /tmp/venv/bin >> "$GITHUB_PATH"
      - name: check
        run: ./run check
      - name: security scan
        run: ./run scan
