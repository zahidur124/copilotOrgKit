name: vault-sync

# Copies this repo's .md files, raw, into the AI vault (zedabedin/ai-vault) at
# Repos/<repo>/<path>, so Obsidian and vault_search see every project's notes
# (owner decision 2026-10-08, claude-projects research/obsidianUsage011026/DECISIONS.md).
# A push to the default branch copies the .md files it changed and deletes the
# copies of removed ones; a manual run copies every .md. Each batch is one commit
# through the multi-file contents API, so it never races the other vault writers.
# VAULT_TOKEN is the user-level Actions secret.

on:
  push:
  workflow_dispatch:
    inputs:
      all:
        description: 'Copy every .md, not only the ones the last push changed'
        default: 'true'

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: deps
        run: command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }

      - name: copy to the AI vault
        env:
          API: http://192.168.50.12:3000/api/v1
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          ALL: ${{ github.event.inputs.all }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, subprocess, sys, urllib.error, urllib.parse, urllib.request

          API, TOKEN, REPO, SHA = (os.environ[k] for k in ("API", "VAULT_TOKEN", "REPO", "SHA"))
          BEFORE = os.environ.get("BEFORE", "")
          # Scraped data pages, not notes (owner decision 2026-10-08).
          SKIP = ("flipSystemV2/articles_markdown/", "resellCalendarData/pages/")

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"{API}/repos/zedabedin/ai-vault/{path}", method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"token {TOKEN}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")[:300]

          # First push, force push or manual run: copy every .md.
          known = BEFORE.strip("0") and subprocess.run(
              ["git", "cat-file", "-e", BEFORE + "^{commit}"], capture_output=True).returncode == 0
          if os.environ.get("ALL") == "true" or not known:
              changed = [("A", p) for p in git("ls-files", "-z", "--", "*.md").split("\0") if p]
          else:
              out = git("diff", "--name-status", "--no-renames", "-z", BEFORE, SHA, "--", "*.md").split("\0")
              changed = list(zip(out[0::2], out[1::2]))

          ops = []
          for status, path in changed:
              if f"{REPO}/{path}".startswith(SKIP):
                  continue
              dest = f"Repos/{REPO}/{path}"
              if status == "D":
                  st, cur = call("GET", f"contents/{urllib.parse.quote(dest)}?ref=main")
                  if st == 200:
                      ops.append({"operation": "delete", "path": dest, "sha": cur["sha"]})
              else:
                  with open(path, "rb") as fh:
                      ops.append({"operation": "upload", "path": dest,
                                  "content": base64.b64encode(fh.read()).decode()})

          print(f"{len(ops)} changes for Repos/{REPO}/")
          for i in range(0, len(ops), 50):
              batch = ops[i:i + 50]
              st, resp = call("POST", "contents", {
                  "branch": "main", "files": batch,
                  "message": f"vault-sync: {REPO} @ {SHA[:8]} ({len(batch)} files)"})
              if st not in (200, 201):
                  sys.exit(f"FAIL: HTTP {st}: {resp}")
              print(f"PASS: {len(batch)} files")
          EOF
